[project]
name = "kubemq-faststream"
version = "0.1.0"
description = "KubeMQ broker adapter for FastStream async messaging framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "KubeMQ", email = "contact@kubemq.io" }]
keywords = ["faststream", "kubemq", "messaging", "grpc", "event-driven", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Networking",
]
dependencies = [
    "faststream>=0.6.7,<0.7.0",
    "kubemq>=4.1.5,<5",
    "anyio>=4,<5",
    "typing_extensions>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "coverage>=7.5",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/kubemq-io/kubemq-faststream"
Documentation = "https://github.com/kubemq-io/kubemq-faststream#readme"
Repository = "https://github.com/kubemq-io/kubemq-faststream"
Issues = "https://github.com/kubemq-io/kubemq-faststream/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubemq_faststream"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a live KubeMQ broker",
]

[tool.coverage.run]
branch = true
source = ["kubemq_faststream"]
omit = ["*/testing.py"]

[tool.coverage.report]
fail_under = 95

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
packages = ["kubemq_faststream"]
